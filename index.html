<html lang="id">

<title>MPI Geografi – Flora, Fauna Indonesia & Karhutla</title>

<style>
:root{--bg:#f4f7f2;--card:#fff;--tx:#1d2b22;--mu:#5c6b61;--ac:#1f7a4d;--bd:#d8e2da;--CR:#c0392b;--EN:#e67e22;--VU:#d4ac0d;--LC:#27ae60;--NE:#8a96a0}
@media(prefers-color-scheme:dark){:root{--bg:#121a15;--card:#1c2620;--tx:#eaf2ec;--mu:#a2b3a7;--ac:#4cc58a;--bd:#2f3d34}}
*{box-sizing:border-box}
body{margin:0;font:17px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 18px;background:var(--ac);color:#fff;flex-wrap:wrap}

nav button{font:inherit;font-weight:600;padding:10px 18px;margin-left:5px;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
nav button.on{background:#fff;color:#14543a}
main{flex:1;min-height:0}
section{display:none;height:100%}section.on{display:flex}
#peta{flex-direction:column}
.filters{padding:6px 12px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:5px}
.fr{display:flex;gap:5px;flex-wrap:wrap;align-items:center}.fr b{font-size:.8rem;color:var(--mu);width:62px}
.chip{font:inherit;font-size:.85rem;padding:6px 12px;border-radius:99px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}

.pin{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;border:3px solid #fff;box-shadow:0 2px 6px #0006}.pin.fl{border-radius:9px}
.badge{display:inline-block;color:#fff;font-weight:700;padding:3px 11px;border-radius:99px;font-size:.85rem;margin:2px 2px 2px 0}
.photo{width:100%;height:180px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:70px;overflow:hidden;margin-bottom:6px}
.photo img{width:100%;height:100%;object-fit:cover}
.lat{font-style:italic;color:var(--mu);margin:0 0 6px}
.box{background:var(--bg);border-left:5px solid var(--ac);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:.93rem}.box.f{border-color:var(--CR)}
.sm{font-size:.8rem;color:var(--mu)}
.leg{position:absolute;z-index:500;bottom:20px;left:10px;background:var(--card);padding:6px 10px;border-radius:10px;font-size:.8rem;box-shadow:0 2px 8px #0004}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 3px 0 8px}
table{width:100%;border-collapse:collapse;font-size:.92rem}td{padding:7px 4px;border-bottom:1px solid var(--bd)}tr.it{cursor:pointer}tr.it:hover{background:var(--bg)}
.page{flex-direction:column;overflow:auto;padding:18px;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.big{font-size:2rem;font-weight:800;color:var(--CR);line-height:1.1}
a.btn{display:inline-block;background:var(--ac);color:#fff;text-decoration:none;padding:11px 16px;border-radius:10px;font-weight:600;margin:4px 6px 4px 0}
#map2wrap{height:62vh;border-radius:12px;overflow:hidden;border:1px solid var(--bd);position:relative}
.step{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.num{flex:none;width:46px;height:46px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.25rem}
.step h3{margin:0}.step ul{display:none;margin:8px 0 0;padding-left:20px}.step.open ul,.step.open .ex{display:block}.ex{display:none}
.step li{margin:3px 0}
@media(max-width:800px){.row{flex-direction:column}#side{width:100%;max-width:none;height:42%;border:0}}
.filters{flex-direction:row!important;flex-wrap:wrap;align-items:center;gap:8px!important}
.sel{font:inherit;font-size:.9rem;padding:8px 10px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
.seg{display:flex;gap:4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.big{font-size:1.6rem}
.ic{border:1px solid var(--bd);border-radius:12px;padding:8px;margin:8px 0}.ic .photo{height:130px;font-size:50px}
.bar{display:grid;grid-template-columns:110px 1fr 80px;gap:8px;align-items:center;margin:6px 0}.bar div{display:flex;background:var(--bg);border-radius:6px;height:20px;overflow:hidden}.bar i{background:#ff9f1a}.bar i.g{background:#7a4a21}
#st{display:none;position:fixed;inset:0;z-index:3000;background:linear-gradient(160deg,#1b1f1c,#2d302b 55%,#101210);color:#fff;grid-template-columns:38% 62%;gap:22px;padding:18px 64px}
#st.on{display:grid}.stl{display:flex;flex-direction:column;gap:12px;overflow:auto}
.stt{display:flex;justify-content:space-between;align-items:center;gap:8px}
#sth{font-size:2.1rem;line-height:1.15;margin:6px 0}#sth span{color:#b5e36b}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stats .big{font-size:2.3rem;color:#fff}.stats .am{color:#ffb000}
.mr{display:grid;grid-template-columns:120px 1fr;gap:8px;font-size:.9rem;border-top:1px solid #fff3;padding-top:8px}.mr b{color:#aab;font-weight:600;font-size:.75rem}
.str{display:flex;flex-direction:column;gap:10px;min-width:0}#sm{flex:1;min-height:0;border-radius:14px;overflow:hidden;background:#111}
#stcards{display:flex;gap:12px;overflow-x:auto;height:215px}
.sc{flex:none;width:190px;background:#fff;color:#1d2b22;border-radius:12px;padding:8px;font-size:.82rem}.sc .photo{height:95px;font-size:40px}.sc .sm{color:#667}
.nv{position:absolute;top:50%;width:46px;height:46px;border-radius:50%;border:0;background:#fff3;color:#fff;font-size:1.8rem;cursor:pointer}.nv.l{left:10px}.nv.r{right:10px}
#st .sm{color:#aab}
@media(max-width:800px){#st{grid-template-columns:1fr;padding:12px 12px;overflow:auto}#sm{height:320px;flex:none}}
#ln{position:absolute;inset:0;width:100%;height:100%;z-index:640;pointer-events:none}
#cards{position:absolute;inset:0;z-index:650;pointer-events:none}
.mc{position:absolute;width:215px;background:var(--card);color:var(--tx);border-radius:14px;padding:8px;box-shadow:0 4px 14px #0006;overflow:hidden;pointer-events:auto;cursor:pointer;font-size:.8rem;line-height:1.3}
